name: Deploy CyberCompile to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: python3 -m pip install --quiet --upgrade pip && python3 -m pip install --quiet -r requirements.txt

      - name: Build static site
        run: |
          echo "Building static site..."
          # Static site files (index.html, style.css, script.js) are already committed
          # Just verify they exist
          ls -la index.html style.css script.js favicon.svg

      - name: Build MkDocs documentation (optional)
        run: |
          if [ -f "mkdocs.yml" ]; then
            echo "Building MkDocs documentation..."
            python3 -m mkdocs build --clean
          else
            echo "No mkdocs.yml found, skipping"
          fi

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          projectName: knowledge-base
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
